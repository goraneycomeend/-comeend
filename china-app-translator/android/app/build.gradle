plugins {
    id "com.android.application"
}

android {
    namespace "com.comeend.tongyeok"
    compileSdk 35

    defaultConfig {
        applicationId "com.comeend.tongyeok"
        minSdk 26          // java.time (Anthropic Java SDK) 이 기본 제공되는 버전
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "0")
    }

    signingConfigs {
        // 사이드로드 전용 앱. 매 빌드 같은 키로 서명해야 덮어쓰기 업데이트가 된다.
        app {
            storeFile file("tongyeok.keystore")
            storePassword "tongyeok"
            keyAlias "tongyeok"
            keyPassword "tongyeok"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.app
        }
        debug {
            signingConfig signingConfigs.app
        }
    }

    lint {
        // 사이드로드 전용이라 스토어용 targetSdk 경고 등으로 릴리스 빌드를 막지 않는다
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*",
                "META-INF/INDEX.LIST", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA",
                "META-INF/versions/9/module-info.class", "META-INF/versions/9/OSGI-INF/MANIFEST.MF",
                "/META-INF/{AL2.0,LGPL2.1}"
            ]
        }
    }
}

dependencies {
    implementation "com.anthropic:anthropic-java:3.3.0"
    // 기기 안에서 도는 중국어 OCR (모델이 APK 에 포함되어 인터넷·구글 서비스 없이 동작)
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}
