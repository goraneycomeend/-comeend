name: Play 출시용 AAB (EAS)

# 수동 실행 전용. GitHub 저장소 Settings → Secrets → Actions 에 EXPO_TOKEN 이 있어야 합니다.
# 서명 키(keystore)는 EAS 가 자동 생성해 Expo 계정에 안전하게 보관합니다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: EXPO_TOKEN 확인
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 없습니다. expo.dev → Account settings → Access tokens 에서 토큰을 만들어 저장소 Secrets 에 EXPO_TOKEN 으로 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm test

      - name: EAS 프로젝트 연결 (없으면 생성)
        run: npx eas-cli@latest init --force --non-interactive

      - name: EAS 클라우드 빌드 (Android App Bundle)
        run: |
          npx eas-cli@latest build --platform android --profile production --non-interactive --json --wait > build.json
          cat build.json

      - name: 결과 정리
        id: out
        run: |
          URL=$(python3 -c 'import json;d=json.load(open("build.json"));d=d[0] if isinstance(d,list) else d;print(d["artifacts"]["buildUrl"])')
          PAGE=$(python3 -c 'import json;d=json.load(open("build.json"));d=d[0] if isinstance(d,list) else d;print(d.get("buildDetailsPageUrl") or "")')
          curl -sSL "$URL" -o "skinjigi-${{ github.run_number }}.aab"
          echo "page=$PAGE" >> "$GITHUB_OUTPUT"
          {
            echo "## Play 업로드용 AAB 준비 완료"
            echo ""
            echo "- Expo 빌드 페이지: $PAGE"
            echo "- 아래 Releases 의 \`.aab\` 파일을 Play Console 에 업로드하세요."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: skinjigi-${{ github.run_number }}.aab

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: play-${{ github.run_number }}
          name: Play 출시용 AAB #${{ github.run_number }}
          body: |
            Google Play Console 에 업로드할 App Bundle 입니다. (폰에 직접 설치되는 파일이 아닙니다)
            Expo 빌드 페이지: ${{ steps.out.outputs.page }}
          files: skinjigi-${{ github.run_number }}.aab
