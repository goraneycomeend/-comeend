[project]
name = "agent-voice"
version = "0.1.0"
description = "요원보이스 — 마이크 음성을 VALORANT 요원 목소리로 바꿔 주는 서버"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
]

[project.optional-dependencies]
rvc = ["rvc-python>=0.1.5"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
